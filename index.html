<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edf5ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1530" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>수능영어 1등급 노트</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수능영어">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: 맑은 하늘 아래 교복 청춘 — 하늘색 히어로 + 응원 캐릭터, 흰 카드, 교복 넥타이 스트라이프 포인트. 한 칼럼 + 하단 탭 */
:root{
  --bg:#edf5ff; --card:#ffffff; --ink:#1d2747; --muted:#5f6b8a; --line:#d8e5f6;
  --sky1:#2b86ee; --sky2:#9ad0ff; --navy:#26335c; --red:#e0384f;
  --pink:#ff6f9a; --pink-soft:#ffe4ed; --hl:#ffd3e1; --mint:#14a378; --mint-soft:#dbf4ea;
  --blue:#2b86ee; --blue-soft:#e1efff; --coral:#e0384f; --coral-soft:#ffe6ea;
  --btn:#1d2747; --btn-ink:#ffffff; --glass:rgba(255,255,255,.82); --glass-ink:#1d2747;
  --font-display:"Jua","Apple SD Gothic Neo",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --font-en:"Bricolage Grotesque","Avenir Next","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1530; --card:#16213f; --ink:#eef3ff; --muted:#9fb0d4; --line:#253358;
  --sky1:#18346c; --sky2:#2f5ea8; --navy:#a9bcff; --red:#ff6b80;
  --pink:#ff8db0; --pink-soft:#3a1f33; --hl:#5a2a45; --mint:#4fd6a8; --mint-soft:#143329;
  --blue:#78b4ff; --blue-soft:#1b2c52; --coral:#ff6b80; --coral-soft:#3b1f2a;
  --btn:#eef3ff; --btn-ink:#16213f; --glass:rgba(16,26,56,.82); --glass-ink:#eef3ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1530; --card:#16213f; --ink:#eef3ff; --muted:#9fb0d4; --line:#253358;
  --sky1:#18346c; --sky2:#2f5ea8; --navy:#a9bcff; --red:#ff6b80;
  --pink:#ff8db0; --pink-soft:#3a1f33; --hl:#5a2a45; --mint:#4fd6a8; --mint-soft:#143329;
  --blue:#78b4ff; --blue-soft:#1b2c52; --coral:#ff6b80; --coral-soft:#3b1f2a;
  --btn:#eef3ff; --btn-ink:#16213f; --glass:rgba(16,26,56,.82); --glass-ink:#eef3ff; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
body{word-break:keep-all;overflow-wrap:anywhere;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(100px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:1.85rem;line-height:1.2}
h2{font-size:1.3rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:.85rem}
.hl{color:var(--pink)}
.panel{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(43,134,238,.06)}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:99px;font-weight:700;min-height:50px;background:var(--card);border:2px solid var(--line)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.yellow{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn.good{background:var(--mint);color:#fff;border-color:var(--mint)}
.btn.bad{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn.wide{flex:1}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.stripe{height:6px;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--navy) 0 6px,var(--card) 6px 8px,var(--red) 8px 11px,var(--card) 11px 13px)}
/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.brand{font-family:var(--font-display);font-size:1.2rem}
.flame{display:inline-flex;align-items:center;gap:4px;padding:6px 12px 6px 9px;border-radius:99px;background:var(--card);font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 1px 0 var(--line)}
.flame svg{width:18px;height:18px;color:var(--pink)}
.flame.off svg{color:var(--muted)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(170deg,var(--sky1) 0%,var(--sky2) 100%);color:#fff;min-height:330px;display:flex;flex-direction:column;justify-content:flex-end}
.flare{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,0) 70%)}
.flare.f1{width:120px;height:120px;left:-30px;top:30px;opacity:.55}
.flare.f2{width:60px;height:60px;left:42%;top:14px;opacity:.6}
.flare.f3{width:220px;height:220px;right:-80px;top:-60px;opacity:.35}
.hero .char{position:absolute;right:-6px;bottom:0;width:54%;max-width:260px;height:100%;object-fit:cover;object-position:50% 8%;-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent 100%);mask-image:linear-gradient(to bottom,#000 70%,transparent 100%)}
.hero .say{position:absolute;left:18px;top:18px;right:48%;z-index:2}
.bubble{display:inline-block;background:#fff;color:#1d2747;padding:10px 14px;border-radius:18px 18px 18px 4px;font-weight:600;font-size:.9rem;line-height:1.4;box-shadow:0 6px 18px rgba(20,40,90,.18)}
.bubble b{color:#e0384f}
.hero .info{position:relative;z-index:2;margin:0 10px 10px;padding:14px 14px 12px;border-radius:20px;background:var(--glass);color:var(--glass-ink);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tier{display:flex;align-items:flex-end;gap:12px}
.grade{font-family:var(--font-display);font-size:3rem;line-height:.95;color:var(--blue)}
.grade small{font-size:1.2rem;color:var(--glass-ink);margin-left:2px}
.next{font-size:.82rem;color:var(--muted);padding-bottom:4px}
.next b{color:var(--glass-ink)}
.xpbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--pink));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.ladder span{text-align:center;font-family:var(--font-display);font-size:.9rem;padding:3px 0;border-radius:8px;background:var(--blue-soft);color:var(--muted)}
.ladder span.done{color:var(--blue)}
.ladder span.now{background:var(--btn);color:var(--btn-ink)}
/* name card */
.namecard{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.ava{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--card);box-shadow:0 0 0 2px var(--pink)}
.ava.sm{width:44px;height:44px;border-width:2px}
.field{display:flex;gap:8px;margin-top:8px}
.lab{font-weight:700;font-size:.88rem}.lab small{font-weight:400;color:var(--muted);margin-left:4px}
.inp{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-top:-4px}
.field input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border-radius:99px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
/* today */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.5rem;font-weight:400}
.ring b small{font-size:.8rem;margin-left:1px}
.mission{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:16px;background:var(--bg)}
.mission .ck{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.mission.done .ck{background:var(--pink);border-color:var(--pink)}
.mission .ck svg{width:15px;height:15px}
.mission div{flex:1;min-width:0}
.mission small{display:block;color:var(--muted);font-size:.8rem}
.mission .xp{font-size:.75rem;font-weight:700;color:var(--blue);flex:none}
.mission.done b{color:var(--muted)}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:18px;background:var(--bg);font-size:.78rem;font-weight:600}
.bdg .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted)}
.bdg .ic svg{width:24px;height:24px}
.bdg.got .ic{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff}
.bdg:not(.got){color:var(--muted)}
.bdg small{font-weight:400;color:var(--muted);font-size:.7rem;line-height:1.3}
/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--card);font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 1px 0 var(--line)}
.chip.fin{color:var(--pink)}
.chip.on{background:var(--btn);color:var(--btn-ink)}
/* word card */
.pips{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.pips i{height:6px;border-radius:3px;background:var(--line)}
.pips i.k{background:var(--mint)} .pips i.u{background:var(--coral)} .pips i.cur{background:var(--blue)}
.deck{position:relative;touch-action:pan-y}
.icard{position:relative;width:100%;min-height:270px;border-radius:26px;background:var(--card);box-shadow:0 2px 0 var(--line),0 14px 30px rgba(43,134,238,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 22px 30px;text-align:center;transition:transform .25s ease;user-select:none;-webkit-user-select:none;overflow:hidden}
.icard::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(-45deg,var(--navy) 0 6px,var(--card) 6px 8px,var(--red) 8px 11px,var(--card) 11px 13px)}
.icard.drag{transition:none}
.icard .en{font-family:var(--font-en);font-weight:800;font-size:2.4rem;line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.icard .ko{font-size:1.2rem;font-weight:700;color:var(--blue)}
.icard .tap{font-size:.82rem;color:var(--muted)}
.icard .no{position:absolute;top:16px;left:18px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp{position:absolute;top:44px;font-family:var(--font-display);font-size:1.4rem;padding:2px 12px;border:3px solid;border-radius:12px;opacity:0;transition:opacity .1s}
.stamp.k{right:18px;color:var(--mint);transform:rotate(10deg)} .stamp.u{left:18px;color:var(--coral);transform:rotate(-10deg)}
.speak{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--blue-soft);color:var(--blue);flex:none}
.speak svg{width:20px;height:20px}
.deck .speak{position:absolute;top:14px;right:12px;z-index:2}
.swipehint{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600}
.swipehint .u{color:var(--coral)} .swipehint .k{color:var(--mint)}
.wlist{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:.88rem}
.wlist button{display:flex;gap:7px;align-items:baseline;min-width:0;text-align:left;padding:4px 0}
.wlist .en{font-family:var(--font-en);font-weight:700;flex:none}
.wlist .k{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.s{background:var(--coral)} .dot.m{background:var(--mint)}
/* sentences */
.pt{display:inline-block;font-size:.78rem;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:4px 10px;border-radius:99px}
.sen{font-family:var(--font-en);font-size:1.3rem;line-height:1.45;font-weight:600}
.chunk{font-family:var(--font-en);font-size:1.05rem;line-height:1.85;font-weight:600}
.chunk em{font-style:normal;background:linear-gradient(transparent 45%,var(--hl) 45%,var(--hl) 92%,transparent 92%);padding:0 2px}
.chunk .sl{color:var(--pink);font-weight:800;padding:0 3px}
.reveal{padding-top:12px;border-top:2px dashed var(--line)}
/* quiz */
.mode{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:22px;background:var(--card);box-shadow:0 1px 0 var(--line)}
.mode .ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.mode .ic svg{width:26px;height:26px}
.mode small{display:block;color:var(--muted);font-size:.82rem}
.mode .cnt{font-family:var(--font-display);font-size:1.6rem}
.qhead{display:flex;justify-content:space-between;align-items:center}
.combo{font-family:var(--font-display);font-size:1.2rem;color:var(--pink);min-height:1.6rem}
.combo.pulse{animation:pop .35s}
.qword{font-family:var(--font-en);font-weight:800;font-size:2.4rem;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:0 1px 0 var(--line);min-height:56px;font-weight:600}
.opt .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.9rem;flex:none;color:var(--muted)}
.opt .n svg{width:16px;height:16px}
.opt.right{background:var(--mint-soft)} .opt.right .n{background:var(--mint);border-color:var(--mint);color:#fff}
.opt.wrong{background:var(--coral-soft);animation:shake .35s} .opt.wrong .n{background:var(--coral);border-color:var(--coral);color:#fff}
.react{display:flex;gap:10px;align-items:center;animation:pop .35s}
.react .bubble{border:2px solid var(--line);box-shadow:none}
.score{font-family:var(--font-display);font-size:4rem;line-height:1;text-align:center}
.score small{font-size:1.6rem;color:var(--muted)}
.qbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:99px;transition:width .3s}
/* record */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:14px 8px;border-radius:16px;background:var(--bg);text-align:center}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.7rem;line-height:1.1}
.stat span{font-size:.75rem;color:var(--muted)}
.wrongs .w{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.wrongs .w:first-child{border-top:0}
.wrongs .en{font-family:var(--font-en);font-weight:700}
.wrongs .k{flex:1;color:var(--muted);font-size:.88rem;min-width:0}
.tag{font-size:.75rem;font-weight:700;color:var(--coral);flex:none;font-variant-numeric:tabular-nums}
.plan{display:flex;flex-direction:column;gap:10px}
.plan div{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.plan .st{font-family:var(--font-display);font-size:1.05rem;text-align:center;padding:4px 0;border-radius:99px;background:var(--blue-soft);color:var(--blue)}
.plan p{margin:0;font-size:.9rem;font-weight:600}
.plan p small{display:block;font-weight:400;color:var(--muted)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--blue)}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:4px;border-radius:0 0 3px 3px;background:repeating-linear-gradient(-45deg,var(--navy) 0 5px,var(--card) 5px 6px,var(--red) 6px 9px,var(--card) 9px 10px)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:.68rem;line-height:18px;font-variant-numeric:tabular-nums}
/* effects */
.float{position:fixed;z-index:40;font-family:var(--font-display);font-size:1.4rem;color:var(--blue);pointer-events:none;animation:up .9s ease-out forwards;text-shadow:0 2px 0 var(--card)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:600;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.cheer{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);z-index:31;width:min(460px,calc(100% - 24px));min-height:96px;padding:14px 16px 14px 112px;border-radius:24px;background:var(--card);box-shadow:0 14px 36px rgba(20,40,90,.28);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.3);pointer-events:none;display:flex;align-items:center}
.cheer img{position:absolute;left:8px;bottom:0;width:96px;height:128px;object-fit:cover;object-position:50% 6%;border-radius:20px 20px 0 18px;background:linear-gradient(170deg,var(--sky1),var(--sky2))}
.cheer.show{opacity:1;transform:translate(-50%,0)}
.cheer p{margin:0;font-weight:700;font-size:1.05rem;line-height:1.4;min-width:0}
.cheer p small{display:block;font-weight:700;color:var(--pink);font-size:.78rem}
.cheer.ok{box-shadow:0 0 0 3px var(--mint),0 14px 36px rgba(20,40,90,.28)} .cheer.no{box-shadow:0 0 0 3px var(--pink),0 14px 36px rgba(20,40,90,.28)}
.react.big{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:end;padding:14px 14px 0;border-radius:24px;background:linear-gradient(170deg,var(--sky1),var(--sky2));overflow:hidden}
.react.big.no{background:linear-gradient(170deg,#ff8fb0,#ffd3e1)}
.react.big .bust{width:118px;height:150px;object-fit:cover;object-position:50% 5%;display:block;border-radius:18px 18px 0 0}
.react.big .say2{padding-bottom:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.react.big .bubble{font-size:1.05rem;border:0;box-shadow:0 6px 18px rgba(20,40,90,.18)}
.react.big .btn{min-height:46px}
.export textarea{width:100%;min-height:120px;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(12,21,48,.55);display:flex;align-items:center;justify-content:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.modal{position:relative;overflow:hidden;background:var(--card);border-radius:28px;text-align:center;max-width:340px;width:100%;animation:pop .4s}
.modal .pic{height:210px;background:linear-gradient(170deg,var(--sky1),var(--sky2));position:relative}
.modal .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 12%;animation:hop .6s ease-out}
.modal .body{padding:18px 22px 20px}
.modal .big{font-family:var(--font-display);font-size:2.6rem;line-height:1.1;color:var(--blue)}
.modal p{margin:8px 0 16px;color:var(--muted)}
.modal p b{color:var(--ink)}
/* character motion */
.charbtn{position:absolute;right:-6px;bottom:0;width:54%;max-width:260px;height:100%;padding:0;z-index:1;cursor:pointer}
.charbtn img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 30%),linear-gradient(to bottom,#000 72%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 30%),linear-gradient(to bottom,#000 72%,transparent 100%);mask-composite:intersect;transform-origin:50% 100%;animation:bob 3.6s ease-in-out infinite}
.charbtn img.alt{position:absolute;inset:0;opacity:0;animation:bob 3.6s ease-in-out infinite,swap 14s ease-in-out infinite}
.charbtn img:not(.alt){animation:bob 3.6s ease-in-out infinite,swapb 14s ease-in-out infinite}
@keyframes swap{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@keyframes swapb{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
.charbtn .tapme{position:absolute;right:14px;top:16px;background:#fff;color:#e0384f;font-weight:700;font-size:.75rem;padding:4px 10px;border-radius:99px;box-shadow:0 4px 12px rgba(20,40,90,.2);animation:nudge 2.4s ease-in-out infinite}
.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.hearts i{position:absolute;bottom:-20px;width:14px;height:14px;opacity:0;animation:rise 6s linear infinite}
.hearts i::before{content:"";position:absolute;inset:0;background:var(--h,#fff);clip-path:path("M7 13 C3 10 0 7.5 0 4.2 C0 1.8 1.9 0 4.1 0 C5.3 0 6.4 .6 7 1.6 C7.6 .6 8.7 0 9.9 0 C12.1 0 14 1.8 14 4.2 C14 7.5 11 10 7 13Z")}
.cheer img{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.react.big .bust{animation:hop .5s ease-out}
.stage{position:fixed;inset:0;z-index:70;background:linear-gradient(175deg,#1f74e0 0%,#7cc2ff 70%,#cfe9ff 100%);display:flex;flex-direction:column;align-items:center;overflow:hidden;cursor:pointer;animation:fadein .3s ease-out;padding-top:env(safe-area-inset-top,0px)}
.stage .glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);animation:drift 7s ease-in-out infinite alternate}
.stage .say{position:relative;z-index:3;margin:18px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));max-width:520px;width:calc(100% - 32px);background:#fff;color:#1d2747;border-radius:24px 24px 24px 6px;padding:16px 18px;box-shadow:0 12px 30px rgba(10,30,80,.25);animation:pop .45s .15s both}
.stage .say .en{font-family:var(--font-en);font-weight:800;font-size:1.45rem;line-height:1.25;min-height:1.25em}
.stage .say .ko{margin-top:6px;color:#5f6b8a;font-size:.95rem;opacity:0;transition:opacity .4s}
.stage .say .ko.on{opacity:1}
.stage .say .who{font-size:.78rem;font-weight:700;color:#e0384f;margin-bottom:4px}
.stage .figure{position:relative;flex:1;width:100%;display:flex;justify-content:center;align-items:flex-end;min-height:0;z-index:2}
.stage .figure img{height:100%;max-height:100%;width:auto;max-width:100%;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;animation:enter .6s cubic-bezier(.2,.9,.3,1.2) both,sway 5s 0.6s ease-in-out infinite}
.stage .hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:3;color:#fff;font-size:.8rem;font-weight:600;background:rgba(20,40,90,.35);padding:6px 14px;border-radius:99px;white-space:nowrap}
.stage .hearts{z-index:2}
.stage.out{animation:fadeout .25s ease-in forwards}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-.6deg)}}
@keyframes sway{0%,100%{transform:translateY(0) scale(1) rotate(0)}25%{transform:translateY(-8px) scale(1.01) rotate(-.8deg)}75%{transform:translateY(-3px) scale(1.005) rotate(.8deg)}}
@keyframes enter{from{transform:translateY(40%) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes hop{0%{transform:translateY(16px)}60%{transform:translateY(-6px)}100%{transform:none}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes rise{0%{transform:translateY(0) translateX(0) scale(.6);opacity:0}10%{opacity:.9}100%{transform:translateY(-110vh) translateX(var(--dx,20px)) scale(1.1);opacity:0}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(30px,40px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------------- 상태 & 저장 ---------------- */
const KEY = "suneung-note-v1";
function blank(){return{v:1,words:{},sent:{},studied:[],quizzes:0,updatedAt:0,xp:0,badges:{},bestCombo:0,perfects:0,charName:"",studentName:"",studentEn:"",daily:{},lastExport:""}}
function normalize(p){
  const s=Object.assign(blank(),p);
  if(p&&p.xp===undefined){ // 이전 버전 기록에서 경험치 계산
    let xp=0; for(const k in s.words){const w=s.words[k]; if(w.seen)xp+=5+(w.b||0)*3}
    xp+=Object.keys(s.sent).length*10+(s.quizzes||0)*20; s.xp=xp;
  }
  if(!s.badges)s.badges={}; if(!s.daily)s.daily={};
  return s;
}
let S = blank();
try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); if(p&&p.v===1)S=normalize(p);}}catch(e){}

let dbRef=null, syncState="local", writing=false, pending=false, timer=null;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(dbRef){clearTimeout(timer);timer=setTimeout(flush,1200)}
}
async function flush(){
  if(!dbRef)return;
  if(writing){pending=true;return}
  writing=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)));syncState="synced"}
  catch(e){if(e&&e.code==="invalid_argument"){dbRef=null;syncState="local"}}
  writing=false;
  if(pending){pending=false;flush()}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------------- 날짜 ---------------- */
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){const[y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function markStudied(){const t=today(); if(!S.studied.includes(t))S.studied.push(t)}
function bump(k){const t=today();const d=S.daily[t]||(S.daily[t]={k:0,u:0,qr:0,qw:0,s:0});d[k]=(d[k]||0)+1;
  const keys=Object.keys(S.daily).sort(); while(keys.length>120)delete S.daily[keys.shift()];}
function daysSince(s){if(!s)return 999;const[y,m,d]=s.split("-").map(Number);return Math.round((new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())-new Date(y,m-1,d))/864e5)}
function streak(){const set=new Set(S.studied);let d=today(),n=0; if(!set.has(d))d=addDays(d,-1); while(set.has(d)){n++;d=addDays(d,-1)} return n}

/* ---------------- 등급 & 경험치 ---------------- */
function rankOf(xp){let r=RANKS[0];for(const x of RANKS)if(xp>=x.min)r=x;return r}
function nextRank(xp){return RANKS.find(x=>x.min>xp)||null}
function addXP(n,el){
  const before=rankOf(S.xp).g; S.xp+=n; floatXP("+"+n+" XP",el);
  const after=rankOf(S.xp).g;
  if(after<before) setTimeout(()=>showModal("levelup",after),450);
}

 good:["정답! 역시 {I}야","{A}, 대단해!","완벽해, 이 기세 그대로 가자","하트 하나 적립!","와, 이것도 알고 있었어?","좋아좋아, 계속 가 보자","오늘 컨디션 최고인데?"],
 bad:["괜찮아 {A}, 이제 알았으니 된 거야","틀린 단어는 내일 다시 만나자","힘내! 한 번 틀린 건 더 오래 기억나","천천히 해도 돼, 옆에 있을게","아깝다! 다음엔 꼭 맞힐 거야"],
 know:["알고 있었구나, 멋져!","좋아, 다음 카드!","이 단어는 이제 네 거야"],

function jong(n){const c=n.charCodeAt(n.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0}
function sn(){return S.studentName||"친구"}
function tpl(t){const n=sn();return String(t).replace(/\{A\}/g,n+(jong(n)?"아":"야")).replace(/\{I\}/g,n+(jong(n)?"이":"")).replace(/\{E\}/g,S.studentEn||"friend")}
function nm(){return S.charName||"응원 친구"}
function heartsHTML(n){const cols=["#ffffff","#ffd3e1","#ff8fb0","#cfe9ff"];let h='<div class="hearts" aria-hidden="true">';for(let i=0;i<n;i++)h+=`<i style="left:${Math.round(Math.random()*90)}%;--dx:${Math.round(Math.random()*60-30)}px;--h:${cols[i%4]};animation-delay:${(i*0.9+Math.random()).toFixed(1)}s;animation-duration:${(5+Math.random()*3).toFixed(1)}s"></i>`;return h+'</div>'}
function enLine(){
  const h=new Date().getHours(), st=streak(), nx=nextRank(S.xp), due=dueList().length, cd=curDay();
  const N="{E}", me=S.charName?`It's me, ${S.charName}. `:"";
  const pool=[
    [`${h<12?"Good morning":h<18?"Good afternoon":"Good evening"}, ${N}! ${me}Ready to learn?`,`${h<12?"좋은 아침":h<18?"안녕":"좋은 저녁"}, {A}! 공부할 준비 됐어?`],
    [`Hi ${N}! I'm so happy to see you today.`,"안녕 {A}! 오늘 만나서 정말 기뻐."],
    [`You're doing great, ${N}. Keep going!`,"{A}, 정말 잘하고 있어. 계속 가자!"],
    ["Every word you learn brings you closer to your goal.","네가 외우는 단어 하나하나가 목표에 더 가까워지게 해."],
    [`Don't give up. I believe in you, ${N}!`,"포기하지 마. 난 {I}를 믿어!"],
    ["Small steps every day make a big difference.","매일의 작은 걸음이 큰 차이를 만들어."],
    ["Let's do our best today, together!","오늘도 같이 최선을 다해 보자!"],
    [`It's okay to make mistakes. That's how we learn.`,"틀려도 괜찮아. 그렇게 배우는 거야."]
  ];
  if(st>=2)pool.push([`You've studied ${st} days in a row. That's amazing!`,`${st}일 연속 공부했어. 정말 대단해!`]);
  if(nx)pool.push([`Only ${nx.min-S.xp} XP to grade ${nx.g}. You can do it!`,`${nx.g}등급까지 ${nx.min-S.xp} XP 남았어. 할 수 있어!`]);
  if(due)pool.push([`We have ${due} words to review. Shall we start?`,`복습할 단어가 ${due}개 있어. 시작해 볼까?`]);
  if(!seenCount())pool.push([`Nice to meet you, ${N}! Let's start with Day 1.`,"만나서 반가워 {A}! Day 1부터 시작하자."]);
  else pool.push([`Today is Day ${cd}. Let's finish it together!`,`오늘은 Day ${cd}야. 같이 끝내 보자!`]);
  const p=pool[Math.floor(Math.random()*pool.length)]; return [tpl(p[0]),tpl(p[1])];
}
let stageTimer=null;
function openStage(){
  const [en,ko]=enLine();
  const el=document.createElement("div"); el.className="stage"; el.id="stage"; el.setAttribute("role","dialog"); el.setAttribute("aria-label",nm());
  el.innerHTML=`<span class="glow" style="width:220px;height:220px;left:-60px;top:12%"></span><span class="glow" style="width:120px;height:120px;right:8%;top:30%;animation-delay:-3s"></span>${heartsHTML(12)}
    <div class="say"><div class="who">${esc(nm())}</div><div class="en" id="stEn"></div><div class="ko" id="stKo">${esc(ko)}</div></div>
    <div class="figure"><img src="${WAVE}" alt=""></div><div class="hint">탭하면 닫혀요</div>`;
  document.body.appendChild(el);
  speak(en);
  const t=$("#stEn"); let i=0; clearInterval(stageTimer);
  if(reduce){t.textContent=en;$("#stKo").classList.add("on")}
  else stageTimer=setInterval(()=>{i++;t.textContent=en.slice(0,i);if(i>=en.length){clearInterval(stageTimer);$("#stKo").classList.add("on")}},38);
}
function closeStage(){const el=$("#stage");if(!el)return;clearInterval(stageTimer);try{speechSynthesis.cancel()}catch(e){}el.classList.add("out");setTimeout(()=>el.remove(),240)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function cheer(txt,mood){

  const css=getComputedStyle(document.documentElement),cols=["--pink","--sky2","--blue","--red"].map(v=>css.getPropertyValue(v).trim());
  const P=Array.from({length:n||120},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.4,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*4)]}));
  let f=0;(function loop(){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<110)requestAnimationFrame(loop);else x.clearRect(0,0,innerWidth,innerHeight)})();
}

function bindSwipe(){
  const c=$("#card"); if(!c)return;
  let sx=0,dx=0,down=false,moved=false;
  c.addEventListener("pointerdown",e=>{down=true;moved=false;sx=e.clientX;dx=0;c.classList.add("drag");try{c.setPointerCapture(e.pointerId)}catch(_){}});
  c.addEventListener("pointermove",e=>{if(!down)return;dx=e.clientX-sx;if(Math.abs(dx)>6)moved=true;c.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;$("#stk").style.opacity=Math.max(0,Math.min(1,dx/90));$("#stu").style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=()=>{if(!down)return;down=false;c.classList.remove("drag");
    if(dx>90){c.style.transform=`translateX(${innerWidth}px) rotate(20deg)`;setTimeout(()=>doRate(true,c),180)}
    else if(dx<-90){c.style.transform=`translateX(${-innerWidth}px) rotate(-20deg)`;setTimeout(()=>doRate(false,c),180)}
    else{c.style.transform="";$("#stk").style.opacity=0;$("#stu").style.opacity=0;if(!moved)flip()}};
  c.addEventListener("pointerup",end);c.addEventListener("pointercancel",()=>{down=false;c.classList.remove("drag");c.style.transform=""});
  c.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}if(e.key==="ArrowRight")doRate(true,c);if(e.key==="ArrowLeft")doRate(false,c)});
}

function doRate(known,el){

  flipped=false;

}

/* 퀴즈 */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(kind){
  let pool;
  if(kind==="due")pool=dueList();
  else if(kind==="wrong")pool=ALL.filter(w=>ws(w.en)&&ws(w.en).wr>0);
  else pool=DAYS[curDay()-1].words;
  if(!pool.length){toast("출제할 단어가 없어요");return}
  const qs=shuffle(pool.slice()).slice(0,10).map(w=>({w,opts:shuffle([w.ko,...shuffle(ALL.filter(x=>x.ko!==w.ko)).slice(0,3).map(x=>x.ko)]),pick:null}));
  quiz={kind,qs,i:0,score:0,combo:0};render();
}
function viewQuiz(){
  const due=dueList().length, wrongN=ALL.filter(w=>ws(w.en)&&ws(w.en).wr>0).length;
  if(!quiz) return topbar()+`
  <div class="stack">
    <h1>단어 퀴즈</h1>
    <p class="muted" style="margin:-6px 0 0">맞히면 1 · 3 · 7 · 14 · 30일 뒤에 다시 나와요. 틀리면 처음부터.</p>
    <button class="mode" data-quiz="due" ${due?"":"disabled"}><span class="ic" style="background:var(--coral-soft);color:var(--coral)">${IC.refresh}</span><span><b>오늘의 복습</b><small>잊어버리기 직전에 다시 보기</small></span><span class="cnt num">${due}</span></button>
    <button class="mode" data-quiz="day"><span class="ic" style="background:var(--blue-soft);color:var(--blue)">${IC.bolt}</span><span><b>Day ${curDay()} 도전</b><small>오늘 단어로 10문항</small></span><span class="cnt num">10</span></button>
    <button class="mode" data-quiz="wrong" ${wrongN?"":"disabled"}><span class="ic" style="background:var(--mint-soft);color:var(--mint)">${IC.x}</span><span><b>오답 격파</b><small>한 번이라도 틀린 단어</small></span><span class="cnt num">${wrongN}</span></button>
  </div>`;
  if(quiz.i>=quiz.qs.length){
    const n=quiz.qs.length, miss=quiz.qs.filter(q=>q.pick!==q.w.ko);
    return topbar()+`
    <div class="stack">
      <section class="panel stack" style="align-items:center;text-align:center">
        <div class="label">결과</div>
        <div class="score num">${quiz.score}<small>/${n}</small></div>
        <div class="react" style="justify-content:center"><img class="ava" src="${quiz.score/n>=.7?JUMP:CHAR}" style="object-position:${quiz.score/n>=.7?"52% 10%":"50% 6%"}" alt=""><div class="bubble" style="text-align:left"><b style="color:var(--pink);font-size:.75rem;display:block">${esc(nm())}</b>${quiz.score===n?"만점! 진짜 최고야, 하트 백 개!":quiz.score/n>=.7?"잘했어! 틀린 것만 한 번 더 보면 완벽해":"괜찮아, 틀린 단어가 보이면 그게 실력이 느는 거야"}</div></div>
      </section>
      ${miss.length?`<section class="panel"><div class="label" style="margin-bottom:6px">틀린 단어</div><div class="wrongs">${miss.map(q=>`<div class="w"><button class="speak" data-say="${esc(q.w.en)}" aria-label="발음">${IC.spk}</button><span class="en">${esc(q.w.en)}</span><span class="k">${esc(q.w.ko)}</span></div>`).join("")}</div></section>`:""}
      <div class="row"><button class="btn wide" data-quiz-exit>퀴즈 목록</button><button class="btn primary wide" data-quiz="${quiz.kind}">한 판 더</button></div>
    </div>`;
  }
  const q=quiz.qs[quiz.i], N=["1","2","3","4"];
  return `
  <div class="stack" style="padding-top:6px">
    <div class="qhead"><button class="btn" style="min-height:40px;padding:6px 12px" data-quiz-exit aria-label="그만하기">${IC.x}</button><span class="label num">${quiz.i+1} / ${quiz.qs.length}</span><span class="combo ${quiz.combo>=2?"pulse":""}" id="combo">${quiz.combo>=2?quiz.combo+" 콤보":""}</span></div>
    <div class="qbar"><i style="width:${quiz.i/quiz.qs.length*100}%"></i></div>
    <section class="panel stack" style="align-items:center;padding:28px 18px">
      <div class="label">알맞은 뜻을 고르세요</div>
      <div class="qword">${esc(q.w.en)}</div>
      <button class="speak" data-say="${esc(q.w.en)}" aria-label="발음">${IC.spk}</button>
    </section>
    ${q.pick!==null&&q.react?`<div class="react big ${q.pick===q.w.ko?"ok":"no"}"><img class="bust" src="${q.pick===q.w.ko?JUMP:CHAR}" style="object-position:${q.pick===q.w.ko?POS[JUMP]:POS[CHAR]}" alt=""><div class="say2"><div class="bubble"><b style="color:var(--pink);font-size:.78rem;display:block">${esc(nm())}</b>${esc(tpl(q.react))}${q.pick!==q.w.ko?`<br><span style="color:#5f6b8a;font-size:.9rem">${esc(q.w.en)} = ${esc(q.w.ko)}</span>`:""}</div><button class="btn primary" data-next>${quiz.i+1<quiz.qs.length?"다음 문제":"결과 보기"}</button></div></div>`:""}
    ${q.opts.map((o,i)=>{let c="";if(q.pick!==null){if(o===q.w.ko)c="right";else if(o===q.pick)c="wrong"}return `<button class="opt ${c}" data-opt="${i}" ${q.pick!==null?"disabled":""}><span class="n">${c==="right"?IC.check:N[i]}</span><span>${esc(o)}</span></button>`}).join("")}
  </div>`;
}

        <div><span class="st">4</span><p>주제 · 요지 · 빈칸<small>연결어(Day 12)를 단서로 글의 흐름 잡기.</small></p></div>

/* 리포트 & 백업 */
const MARK_A="===== 백업 데이터 시작 (복원용, 수정하지 마세요) =====", MARK_B="===== 백업 데이터 끝 =====";
function buildReport(){
  const r=rankOf(S.xp), boxes=[0,0,0,0,0]; ALL.forEach(w=>{const s=ws(w.en);if(s&&s.seen)boxes[s.b||0]++});
  const L=[];
  L.push("[수능영어 1등급 노트 · 학습 리포트]"); L.push("학생: "+(S.studentName||"-"));
  L.push("생성일: "+today());
  L.push("");
  L.push("■ 요약");
  L.push(`- 현재 등급(앱 레벨): ${r.g}등급 / 총 ${S.xp} XP`);
  L.push(`- 공부한 날: ${S.studied.length}일 / 현재 연속 ${streak()}일 / 마지막 공부일 ${S.studied.slice().sort().pop()||"-"}`);
  L.push(`- 학습 단어: ${seenCount()} / ${ALL.length} · 장기 기억(3단계 이상): ${masteredCount()}`);
  L.push(`- 복습 단계 분포: 0단계 ${boxes[0]} · 1단계 ${boxes[1]} · 2단계 ${boxes[2]} · 3단계 ${boxes[3]} · 4단계 ${boxes[4]}`);
  L.push(`- 오늘 복습 대기: ${dueList().length}개`);
  L.push(`- 퀴즈: ${S.quizzes||0}회 · 만점 ${S.perfects||0}회 · 최고 콤보 ${S.bestCombo||0}`);
  L.push("");
  L.push("■ Day별 진행 (본 단어 / 오답 경험 단어)");
  DAYS.forEach(d=>{const seen=d.words.filter(w=>ws(w.en)&&ws(w.en).seen).length, wr=d.words.filter(w=>ws(w.en)&&ws(w.en).wr>0).length; L.push(`- Day ${d.day} ${d.title}: ${seen}/20 · 오답 ${wr}`)});
  L.push("");
  const sd=SENTS.map((x,i)=>({...x,i})); L.push(`■ 구문 문장: ${Object.keys(S.sent).length}/30 익힘`);
  const notyet=sd.filter(x=>!S.sent[x.i]&&x.d<=curDay()).map(x=>`Day ${x.d} ${x.pt}`); if(notyet.length)L.push("- 아직 안 익힌 구문(진도 내): "+notyet.join(", "));
  L.push("");
  L.push("■ 최근 14일 기록 (카드 알아요/몰라요 · 퀴즈 정답/오답 · 문장)");
  const days=Object.keys(S.daily).sort().slice(-14);
  if(!days.length)L.push("- 기록 없음");
  days.forEach(k=>{const d=S.daily[k];L.push(`- ${k}: 카드 ${d.k||0}/${d.u||0} · 퀴즈 ${d.qr||0}/${d.qw||0} · 문장 ${d.s||0}`)});
  L.push("");
  const wrongs=ALL.filter(w=>ws(w.en)&&ws(w.en).wr>0).sort((a,b)=>ws(b.en).wr-ws(a.en).wr).slice(0,40);
  L.push(`■ 오답 상위 ${wrongs.length}개 (단어 = 뜻 · 틀린 횟수 · 현재 단계)`);
  wrongs.forEach(w=>L.push(`- ${w.en} = ${w.ko} · ${ws(w.en).wr}회 · ${ws(w.en).b||0}단계 (Day ${w.day})`));
  L.push("");
  L.push(MARK_A); L.push(JSON.stringify(S)); L.push(MARK_B);
  return L.join("\n");
}
let exportText="", importOpen=false, importConfirm=null;
async function doExport(how,btn){
  exportText=buildReport();
  if(how==="file"){
    const fname=`수능영어-리포트-${today()}.txt`;
    try{const f=new File([exportText],fname,{type:"text/plain"});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"수능영어 리포트"});S.lastExport=today();save();render();cheer("보내기 완료! 다음 단계를 기대해 줘","ok");return}
    }catch(e){if(e&&e.name==="AbortError"){toast("보내기를 취소했어요");return}}
    try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([exportText],{type:"text/plain"}));a.download=fname;document.body.appendChild(a);a.click();a.remove();S.lastExport=today();save();render();return}catch(e){}
    toast("파일 저장이 안 돼서 아래에 내용을 띄웠어요. 복사해 주세요"); render(); return;
  }
  try{await navigator.clipboard.writeText(exportText);S.lastExport=today();save();render();cheer("복사 완료! 채팅에 붙여 넣어서 보내 줘","ok")}
  catch(e){render();toast("자동 복사가 안 돼요. 아래 글을 길게 눌러 전체 선택 후 복사해 주세요");const t=$("#exportTa");if(t){t.focus();t.select()}}
}
function parseBackup(txt){
  const a=txt.indexOf(MARK_A), b=txt.indexOf(MARK_B);
  const body=(a>=0&&b>a)?txt.slice(a+MARK_A.length,b):txt;
  try{const p=JSON.parse(body.trim()); if(p&&p.v===1&&p.words)return normalize(p)}catch(e){}
  return null;
}

/* 렌더 */
function render(){
  $("#app").innerHTML={home:viewHome,words:viewWords,sents:viewSents,quiz:viewQuiz,record:viewRecord}[tab]();
  renderTabs(); if(tab==="words")bindSwipe();
  const rb=document.querySelector(".react.big"); if(rb)rb.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"});
  const on=document.querySelector(".chip.on"); if(on)on.scrollIntoView({block:"nearest",inline:"center"});
}

document.addEventListener("click",e=>{
  if(e.target.closest("#stage")){closeStage();return}
  const t=e.target.closest("button,[data-close]"); if(!t)return;
  if(t.dataset.stage!==undefined){openStage();return}
  const d=t.dataset;
  if(d.close!==undefined){if(t.classList.contains("overlay")&&e.target!==t)return;$("#modal").innerHTML="";if(d.go)go(d.go);return}
  if(d.tab){go(d.tab);return}
  if(d.say!==undefined){speak(d.say);return}
  if(d.go){if(d.setday){selDay=+d.setday;cardIdx=null;flipped=false}go(d.go);return}
  if(d.day){selDay=+d.day;cardIdx=null;flipped=false;render();return}
  if(d.rate!==undefined){doRate(d.rate==="1",t);return}
  if(d.jump){cardIdx=+d.jump;flipped=false;render();scrollTo({top:0,behavior:reduce?"auto":"smooth"});return}
  if(d.open){open[d.open]=!open[d.open];render();return}
  if(d.sdone){if(S.sent[d.sdone])delete S.sent[d.sdone];else{S.sent[d.sdone]=1;markStudied();addXP(10,t);bump("s");cheer(pick(LINES.sent))}checkBadges();save();render();return}
  if(d.quiz){startQuiz(d.quiz);return}
  if(d.quizExit!==undefined){quiz=null;render();return}
  if(d.opt!==undefined&&quiz){
    const q=quiz.qs[quiz.i]; q.pick=q.opts[+d.opt]; const ok=q.pick===q.w.ko;
    rate(q.w.en,ok); bump(ok?"qr":"qw");
    if(ok){quiz.score++;quiz.combo++;S.bestCombo=Math.max(S.bestCombo||0,quiz.combo);let g=8;if(quiz.combo%5===0){g+=10;toast(quiz.combo+" 콤보 보너스 +10")}addXP(g,t);
      q.react=quiz.combo>=3?`${quiz.combo}콤보! 멈추지 말자`:pick(LINES.good)}
    else{quiz.combo=0;q.react=pick(LINES.bad)}
    checkBadges(); save(); render(); return}
  if(d.next!==undefined&&quiz){quiz.i++;
    if(quiz.i>=quiz.qs.length){S.quizzes=(S.quizzes||0)+1;if(quiz.score===quiz.qs.length&&quiz.qs.length>=10){S.perfects=(S.perfects||0)+1;addXP(30);confetti(160)}checkBadges();save()}
    render();return}
  if(d.export){doExport(d.export,t);return}
  if(d.import){
    if(d.import==="toggle"){importOpen=!importOpen;importConfirm=null;render();return}
    if(d.import==="check"){const v=($("#importTa")||{}).value||"";const p=parseBackup(v);if(!p){toast("백업 데이터를 찾지 못했어요. 리포트 전체를 붙여 넣어 주세요");return}importConfirm=p;render();return}
    if(d.import==="cancel"){importConfirm=null;render();return}
    if(d.import==="apply"&&importConfirm){S=importConfirm;importConfirm=null;importOpen=false;save();selDay=curDay();cardIdx=null;render();cheer("복원 완료! 다시 이어서 가자","ok");return}
  }
  if(d.reset){if(d.reset==="ask")confirmReset=true;else if(d.reset==="no")confirmReset=false;else{S=blank();save();confirmReset=false;selDay=1;cardIdx=null;toast("기록을 지웠어요")}render();return}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="nameForm")return; e.preventDefault();
  const st=($("#stuIn").value||"").trim().slice(0,8), en=($("#enIn").value||"").trim().slice(0,16), v=($("#nameIn").value||"").trim().slice(0,10);
  if(!st||!v){toast("내 이름과 응원 친구 이름을 적어 주세요");return}
  const first=!(S.charName&&S.studentName); S.studentName=st; S.studentEn=en; S.charName=v; save(); render(); scrollTo(0,0);
  cheer(first?`${v}! 마음에 들어. {A}, 오늘부터 같이 1등급 가자!`:"이름 저장했어!","ok");
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABN[h]&&h!==tab){tab=h;render()}});
render();
